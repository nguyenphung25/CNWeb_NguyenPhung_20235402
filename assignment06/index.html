<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Bài thực hành React CRUD - Quản lý người dùng" />
  <title>Quản lý người dùng | React CRUD</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27 fill=%27none%27 stroke=%27%234f46e5%27 stroke-width=%272.2%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27%3E%3Cpath d=%27M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2%27/%3E%3Ccircle cx=%279%27 cy=%277%27 r=%274%27/%3E%3Cpath d=%27M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75%27/%3E%3C/svg%3E" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>

  <style>
    :root {
      --bg: #f4f6fb;
      --surface: #ffffff;
      --surface-2: #f8fafc;
      --surface-hover: #f5f7ff;
      --border: #e3e8f0;
      --border-strong: #cfd6e3;
      --text: #0f172a;
      --text-2: #334155;
      --muted: #64748b;
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-soft: #eef2ff;
      --primary-text: #4338ca;
      --danger: #dc2626;
      --danger-soft: #fef2f2;
      --danger-border: #fecaca;
      --success: #16a34a;
      --success-soft: #f0fdf4;
      --mark: #fef08a;
      --ring: rgba(79, 70, 229, 0.28);
      --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.06);
      --shadow: 0 1px 3px rgba(15, 23, 42, 0.06), 0 12px 32px rgba(15, 23, 42, 0.06);
      --shadow-lg: 0 24px 64px rgba(15, 23, 42, 0.22);
      --hero-from: #4f46e5;
      --hero-to: #7c3aed;
      --skeleton: #e9edf4;
      --overlay: rgba(15, 23, 42, 0.5);
      color-scheme: light;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      color: var(--text);
      background: var(--bg);
      font-family: "Be Vietnam Pro", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 15px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    button, input { font: inherit; color: inherit; }
    button { cursor: pointer; }
    a { color: inherit; }
    svg { flex-shrink: 0; }

    :focus-visible { outline: 3px solid var(--ring); outline-offset: 2px; }

    .app-shell {
      width: min(1240px, calc(100% - 32px));
      margin: 0 auto;
      padding: 32px 0 56px;
    }

    /* ---------- Hero ---------- */
    .hero {
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 32px 36px;
      margin-bottom: 24px;
      border-radius: 22px;
      color: #fff;
      background: linear-gradient(120deg, var(--hero-from), var(--hero-to));
      box-shadow: 0 18px 40px rgba(79, 70, 229, 0.25);
    }

    .hero::before, .hero::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      pointer-events: none;
    }
    .hero::before { width: 320px; height: 320px; right: -80px; top: -150px; }
    .hero::after { width: 200px; height: 200px; right: 180px; bottom: -130px; }

    .hero-text { position: relative; z-index: 1; }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 12px;
      padding: 5px 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.16);
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.8rem, 4vw, 2.6rem);
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: -0.02em;
    }

    .subtitle { max-width: 560px; margin: 10px 0 0; color: rgba(255, 255, 255, 0.82); }

    .stat-card {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 210px;
      padding: 16px 20px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(8px);
    }

    .stat-icon {
      display: grid;
      place-items: center;
      width: 46px;
      height: 46px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.2);
    }

    .stat-card span { display: block; color: rgba(255, 255, 255, 0.82); font-size: 0.82rem; }
    .stat-card strong { display: block; font-size: 1.75rem; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; }

    /* ---------- Panel / toolbar ---------- */
    .panel {
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 20px;
      border-bottom: 1px solid var(--border);
    }

    .search-wrap { position: relative; width: min(100%, 420px); }

    .search-icon {
      position: absolute;
      top: 50%;
      left: 14px;
      color: var(--muted);
      transform: translateY(-50%);
      pointer-events: none;
    }

    .search-input, .form-input {
      width: 100%;
      min-height: 44px;
      border: 1px solid var(--border-strong);
      border-radius: 11px;
      outline: none;
      background: var(--surface);
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .search-input { padding: 10px 14px 10px 42px; }
    .form-input { padding: 10px 12px; }
    .search-input::placeholder, .form-input::placeholder { color: var(--muted); opacity: 0.8; }

    .search-input:focus, .form-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px var(--ring);
    }

    /* ---------- Buttons ---------- */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 44px;
      padding: 9px 16px;
      border: 1px solid transparent;
      border-radius: 11px;
      font-weight: 600;
      white-space: nowrap;
      transition: background 0.15s, border-color 0.15s, color 0.15s, box-shadow 0.15s, transform 0.1s;
    }

    .btn:active { transform: translateY(1px); }
    .btn-primary { color: #fff; background: var(--primary); box-shadow: 0 6px 16px rgba(79, 70, 229, 0.28); }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-secondary { color: var(--text-2); border-color: var(--border-strong); background: var(--surface); }
    .btn-secondary:hover { background: var(--surface-2); border-color: var(--muted); }
    .btn-small { min-height: 36px; padding: 6px 10px; gap: 6px; font-size: 0.86rem; border-radius: 9px; }
    .btn-edit { color: var(--primary-text); border-color: transparent; background: var(--primary-soft); }
    .btn-edit:hover { border-color: var(--primary); }
    .btn-delete { color: var(--danger); border-color: transparent; background: var(--danger-soft); }
    .btn-delete:hover { border-color: var(--danger-border); }

    .icon-btn {
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 10px;
      color: var(--muted);
      background: transparent;
    }
    .icon-btn:hover { color: var(--text); background: var(--surface-2); }

    /* ---------- Table ---------- */
    .table-scroll { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }

    th {
      padding: 12px 12px;
      color: var(--muted);
      background: var(--surface-2);
      font-size: 0.74rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-align: left;
      text-transform: uppercase;
      white-space: nowrap;
    }

    td {
      padding: 14px 12px;
      border-top: 1px solid var(--border);
      color: var(--text-2);
      font-size: 0.92rem;
      vertical-align: middle;
    }

    tbody tr { transition: background 0.15s; }
    tbody tr:hover { background: var(--surface-hover); }
    tbody tr.row-flash { animation: flash 1.6s ease-out; }

    @keyframes flash {
      0%, 35% { background: var(--primary-soft); box-shadow: inset 3px 0 0 var(--primary); }
      100% { background: transparent; box-shadow: inset 3px 0 0 transparent; }
    }

    .cell-id { color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; width: 56px; }

    th:first-child, td:first-child { padding-left: 20px; }
    th:last-child, td:last-child { padding-right: 20px; }
    .user-cell { display: flex; align-items: center; gap: 10px; min-width: 170px; }
    .user-cell strong { color: var(--text); font-weight: 600; }
    .username-cell { color: var(--muted); white-space: nowrap; }

    .avatar {
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .email-cell a { text-decoration: none; }
    .email-cell a:hover { color: var(--primary-text); text-decoration: underline; }
    .address-cell { min-width: 170px; line-height: 1.45; }
    .phone-cell { min-width: 120px; line-height: 1.45; font-variant-numeric: tabular-nums; }

    .actions { display: flex; gap: 6px; justify-content: flex-end; }
    th.th-actions { text-align: right; }

    mark { padding: 0 1px; border-radius: 3px; color: inherit; background: var(--mark); }
    .empty-dash { color: var(--muted); }

    .table-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 20px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.86rem;
    }
    .table-footer strong { color: var(--text); }

    /* ---------- States ---------- */
    .skeleton {
      display: block;
      height: 12px;
      border-radius: 6px;
      background: linear-gradient(90deg, var(--skeleton) 0%, var(--surface-2) 50%, var(--skeleton) 100%);
      background-size: 200% 100%;
      animation: shimmer 1.3s linear infinite;
    }
    .skeleton-circle { width: 40px; height: 40px; border-radius: 50%; }
    @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }

    .state-message {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 56px 24px;
      color: var(--muted);
      text-align: center;
    }
    .state-icon {
      display: grid;
      place-items: center;
      width: 56px;
      height: 56px;
      margin-bottom: 8px;
      border-radius: 16px;
      color: var(--primary-text);
      background: var(--primary-soft);
    }
    .state-message.is-error .state-icon { color: var(--danger); background: var(--danger-soft); }
    .state-message strong { color: var(--text); font-size: 1.02rem; }
    .state-message .btn { margin-top: 12px; }

    /* ---------- Modal ---------- */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: grid;
      place-items: center;
      padding: 20px;
      background: var(--overlay);
      backdrop-filter: blur(4px);
      animation: fade-in 0.18s ease-out;
    }

    .modal {
      width: min(640px, 100%);
      max-height: calc(100vh - 40px);
      overflow-y: auto;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--surface);
      box-shadow: var(--shadow-lg);
      animation: pop-in 0.22s cubic-bezier(0.2, 0.9, 0.3, 1.2);
    }

    @keyframes fade-in { from { opacity: 0; } }
    @keyframes pop-in { from { opacity: 0; transform: translateY(12px) scale(0.97); } }

    .modal-header {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 22px 24px 18px;
      border-bottom: 1px solid var(--border);
    }
    .modal-header-icon {
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      border-radius: 12px;
      color: var(--primary-text);
      background: var(--primary-soft);
    }
    .modal-header-text { flex: 1; }
    .modal-header h2 { margin: 0; font-size: 1.2rem; font-weight: 700; }
    .modal-header p { margin: 4px 0 0; color: var(--muted); font-size: 0.88rem; }

    .modal-body { padding: 20px 24px 8px; }
    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      padding: 16px 24px;
      border-top: 1px solid var(--border);
      background: var(--surface-2);
    }

    .form-section + .form-section { margin-top: 20px; }
    .form-section h3 {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .form-section h3::after { content: ""; flex: 1; height: 1px; background: var(--border); }

    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 16px; padding-bottom: 12px; }
    .field label { display: block; margin-bottom: 6px; color: var(--text-2); font-size: 0.86rem; font-weight: 600; }
    .field-full { grid-column: 1 / -1; }
    .required { color: var(--danger); }

    /* ---------- Toast ---------- */
    .toast {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 1100;
      display: flex;
      align-items: center;
      gap: 12px;
      max-width: min(380px, calc(100vw - 32px));
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-left: 4px solid var(--success);
      border-radius: 12px;
      background: var(--surface);
      box-shadow: var(--shadow-lg);
      color: var(--text);
      font-weight: 500;
      animation: toast-in 0.25s ease-out;
    }
    .toast svg { color: var(--success); }
    .toast.is-danger { border-left-color: var(--danger); }
    .toast.is-danger svg { color: var(--danger); }
    @keyframes toast-in { from { opacity: 0; transform: translateY(16px); } }

    /* ---------- Responsive ---------- */
    @media (max-width: 760px) {
      .app-shell { width: calc(100% - 32px); padding-top: 16px; }
      .hero { flex-direction: column; align-items: stretch; padding: 24px 22px; }
      .stat-card { min-width: 0; }
      .toolbar { flex-direction: column; align-items: stretch; padding: 16px; }
      .search-wrap { width: 100%; }

      thead { display: none; }
      table, tbody, tr, td { display: block; width: 100%; }
      tbody tr {
        position: relative;
        display: grid;
        gap: 12px;
        padding: 16px;
        border-top: 1px solid var(--border);
      }
      td, td:first-child, td:last-child { padding: 0; border: 0; }
      td[data-label]::before {
        content: attr(data-label);
        display: block;
        margin-bottom: 2px;
        color: var(--muted);
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .cell-id { position: absolute; top: 18px; right: 16px; width: auto; padding: 0 !important; }
      .user-cell, .address-cell { min-width: 0; }
      .username-cell, .phone-cell { white-space: normal; }
      .actions { justify-content: stretch; }
      .actions .btn { flex: 1; min-height: 42px; }

      .table-footer { flex-direction: column; align-items: flex-start; padding: 14px 16px; }
      .form-grid { grid-template-columns: 1fr; }
      .field-full { grid-column: auto; }
      .modal-header, .modal-body, .modal-footer { padding-left: 18px; padding-right: 18px; }
      .modal-footer .btn { flex: 1; }
      .toast { right: 16px; bottom: 16px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const EMPTY_USER = {
      name: "",
      username: "",
      email: "",
      address: { street: "", suite: "", city: "" },
      website: ""
    };

    const ICONS = {
      search: <><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></>,
      plus: <path d="M12 5v14M5 12h14" />,
      edit: <><path d="M12 20h9" /><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z" /></>,
      trash: <><path d="M3 6h18" /><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" /><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" /></>,
      close: <path d="M18 6 6 18M6 6l12 12" />,
      users: <><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" /><circle cx="9" cy="7" r="4" /><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75" /></>,
      userPlus: <><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" /><circle cx="9" cy="7" r="4" /><path d="M19 8v6M22 11h-6" /></>,
      check: <><circle cx="12" cy="12" r="10" /><path d="m9 12 2 2 4-4" /></>,
      alert: <><circle cx="12" cy="12" r="10" /><path d="M12 8v4M12 16h.01" /></>,
      searchX: <><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5M8.5 8.5l5 5M13.5 8.5l-5 5" /></>,
      refresh: <><path d="M21 12a9 9 0 1 1-2.64-6.36L21 8" /><path d="M21 3v5h-5" /></>
    };

    function Icon({ name, size = 18 }) {
      return (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor"
          strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
          {ICONS[name]}
        </svg>
      );
    }

    const AVATAR_COLORS = [
      ["#e0e7ff", "#4338ca"], ["#dcfce7", "#15803d"], ["#fef3c7", "#b45309"],
      ["#fce7f3", "#be185d"], ["#e0f2fe", "#0369a1"], ["#ede9fe", "#6d28d9"]
    ];

    function Avatar({ id, name }) {
      const words = name.trim().split(/\s+/).filter(Boolean);
      const initials = words.length > 1 ? words[0][0] + words[words.length - 1][0] : (words[0] || "?").slice(0, 2);
      const [background, color] = AVATAR_COLORS[id % AVATAR_COLORS.length];
      return <span className="avatar" style={{ background, color }} aria-hidden="true">{initials.toUpperCase()}</span>;
    }

    function Highlight({ text, keyword }) {
      if (!keyword) return text;
      const index = text.toLowerCase().indexOf(keyword);
      if (index === -1) return text;
      return (
        <>
          {text.slice(0, index)}
          <mark>{text.slice(index, index + keyword.length)}</mark>
          {text.slice(index + keyword.length)}
        </>
      );
    }

    function SearchForm({ onChangeValue }) {
      return (
        <div className="search-wrap">
          <span className="search-icon"><Icon name="search" /></span>
          <input
            className="search-input"
            type="search"
            aria-label="Tìm người dùng"
            placeholder="Tìm theo họ tên hoặc username..."
            onChange={(event) => onChangeValue(event.target.value)}
          />
        </div>
      );
    }

    const FORM_SECTIONS = [
      {
        title: "Thông tin cơ bản",
        fields: [
          { id: "name", label: "Họ và tên", required: true, placeholder: "VD: Nguyễn Văn A" },
          { id: "username", label: "Username", required: true, placeholder: "VD: nguyenvana" },
          { id: "email", label: "Email", type: "email", placeholder: "ten@example.com" },
          { id: "phone", label: "Số điện thoại", type: "tel", placeholder: "VD: 0912 345 678" },
          { id: "website", label: "Website", full: true, placeholder: "VD: example.com" }
        ]
      },
      {
        title: "Địa chỉ",
        fields: [
          { id: "street", label: "Tên đường", group: "address", placeholder: "VD: Đại Cồ Việt" },
          { id: "suite", label: "Số nhà / căn hộ", group: "address", placeholder: "VD: Số 1" },
          { id: "city", label: "Thành phố", group: "address", full: true, placeholder: "VD: Hà Nội" }
        ]
      }
    ];

    function UserFields({ value, onChange }) {
      return FORM_SECTIONS.map((section) => (
        <fieldset className="form-section" key={section.title} style={{ border: 0, margin: 0, padding: 0 }}>
          <h3>{section.title}</h3>
          <div className="form-grid">
            {section.fields.map((field) => (
              <div className={`field ${field.full ? "field-full" : ""}`} key={field.id}>
                <label htmlFor={field.id}>
                  {field.label} {field.required && <span className="required" aria-hidden="true">*</span>}
                </label>
                <input
                  className="form-input"
                  id={field.id}
                  type={field.type || "text"}
                  placeholder={field.placeholder}
                  value={field.group ? value[field.group][field.id] : value[field.id]}
                  onChange={onChange}
                  required={field.required}
                  autoFocus={field.id === "name"}
                  autoComplete="off"
                />
              </div>
            ))}
          </div>
        </fieldset>
      ));
    }

    function UserModal({ title, description, icon, value, submitLabel, onChange, onSubmit, onClose }) {
      const closeRef = React.useRef(onClose);
      closeRef.current = onClose;

      // Đóng modal bằng phím Esc và khóa cuộn trang phía sau khi modal đang mở
      React.useEffect(() => {
        const handleKey = (event) => event.key === "Escape" && closeRef.current();
        const previousOverflow = document.body.style.overflow;
        document.addEventListener("keydown", handleKey);
        document.body.style.overflow = "hidden";
        return () => {
          document.removeEventListener("keydown", handleKey);
          document.body.style.overflow = previousOverflow;
        };
      }, []);

      function handleSubmit(event) {
        event.preventDefault();
        onSubmit();
      }

      return (
        <div className="modal-backdrop" role="presentation" onMouseDown={(event) => event.target === event.currentTarget && onClose()}>
          <form className="modal" onSubmit={handleSubmit} role="dialog" aria-modal="true" aria-labelledby="modal-title">
            <div className="modal-header">
              <span className="modal-header-icon"><Icon name={icon} size={22} /></span>
              <div className="modal-header-text">
                <h2 id="modal-title">{title}</h2>
                <p>{description}</p>
              </div>
              <button className="icon-btn" type="button" onClick={onClose} aria-label="Đóng" title="Đóng (Esc)">
                <Icon name="close" />
              </button>
            </div>
            <div className="modal-body">
              <UserFields value={value} onChange={onChange} />
            </div>
            <div className="modal-footer">
              <button className="btn btn-secondary" type="button" onClick={onClose}>Hủy</button>
              <button className="btn btn-primary" type="submit">{submitLabel}</button>
            </div>
          </form>
        </div>
      );
    }

    function Toast({ toast }) {
      if (!toast) return null;
      return (
        <div className={`toast ${toast.type === "danger" ? "is-danger" : ""}`} role="status" aria-live="polite" key={toast.id}>
          <Icon name={toast.type === "danger" ? "trash" : "check"} size={20} />
          <span>{toast.message}</span>
        </div>
      );
    }

    function updateUserField(setter, event) {
      const { id, value } = event.target;
      const isAddressField = ["street", "suite", "city"].includes(id);

      setter((previous) => isAddressField
        ? { ...previous, address: { ...previous.address, [id]: value } }
        : { ...previous, [id]: value }
      );
    }

    function AddUser({ onAdd }) {
      const [adding, setAdding] = React.useState(false);
      const [user, setUser] = React.useState({ ...EMPTY_USER, address: { ...EMPTY_USER.address } });

      function handleAdd() {
        if (!user.name.trim() || !user.username.trim()) {
          alert("Vui lòng nhập Name và Username!");
          return;
        }
        onAdd({ ...user, name: user.name.trim(), username: user.username.trim() });
        setUser({ ...EMPTY_USER, address: { ...EMPTY_USER.address } });
        setAdding(false);
      }

      return (
        <>
          <button className="btn btn-primary" type="button" onClick={() => setAdding(true)}>
            <Icon name="plus" /> Thêm người dùng
          </button>
          {adding && (
            <UserModal
              title="Thêm người dùng"
              description="Nhập thông tin cho người dùng mới. Các trường có dấu * là bắt buộc."
              icon="userPlus"
              value={user}
              submitLabel="Thêm người dùng"
              onChange={(event) => updateUserField(setUser, event)}
              onSubmit={handleAdd}
              onClose={() => setAdding(false)}
            />
          )}
        </>
      );
    }

    // Lấy ID lớn nhất hiện có + 1 để không bị trùng ID sau khi xóa
    function getNextId(list) {
      return list.length ? Math.max(...list.map((item) => item.id)) + 1 : 1;
    }

    function ResultTable({ keyword, user, onAdded, onCountChange }) {
      const [users, setUsers] = React.useState([]);
      const [loading, setLoading] = React.useState(true);
      const [error, setError] = React.useState("");
      const [editing, setEditing] = React.useState(null);
      const [reloadKey, setReloadKey] = React.useState(0);
      const [toast, setToast] = React.useState(null);
      const [flashId, setFlashId] = React.useState(null);
      const usersRef = React.useRef(users);
      usersRef.current = users;

      React.useEffect(() => {
        const controller = new AbortController();
        setLoading(true);
        setError("");
        fetch("https://jsonplaceholder.typicode.com/users", { signal: controller.signal })
          .then((response) => {
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            return response.json();
          })
          .then((data) => setUsers(data))
          .catch((requestError) => {
            if (requestError.name !== "AbortError") setError("Không thể tải danh sách người dùng. Vui lòng kiểm tra kết nối mạng và thử lại.");
          })
          .finally(() => setLoading(false));
        return () => controller.abort();
      }, [reloadKey]);

      React.useEffect(() => {
        onCountChange(users.length);
      }, [users, onCountChange]);

      React.useEffect(() => {
        if (!toast) return;
        const timer = setTimeout(() => setToast(null), 2800);
        return () => clearTimeout(timer);
      }, [toast]);

      React.useEffect(() => {
        if (flashId === null) return;
        const timer = setTimeout(() => setFlashId(null), 1700);
        return () => clearTimeout(timer);
      }, [flashId]);

      function notify(message, type = "success") {
        setToast({ id: Date.now(), message, type });
      }

      React.useEffect(() => {
        if (!user) return;
        const created = { ...user, id: getNextId(usersRef.current), address: { ...user.address } };
        setUsers((previous) => [...previous, created]);
        setFlashId(created.id);
        notify(`Đã thêm người dùng "${created.name}".`);
        onAdded();
      }, [user, onAdded]);

      function beginEdit(selectedUser) {
        setEditing({ ...selectedUser, address: { ...selectedUser.address } });
      }

      function saveEdit() {
        if (!editing.name.trim() || !editing.username.trim()) {
          alert("Vui lòng nhập Name và Username!");
          return;
        }
        const updated = { ...editing, name: editing.name.trim(), username: editing.username.trim() };
        setUsers((previous) => previous.map((item) => item.id === updated.id ? updated : item));
        setEditing(null);
        setFlashId(updated.id);
        notify(`Đã cập nhật người dùng "${updated.name}".`);
      }

      function removeUser(selectedUser) {
        setUsers((previous) => previous.filter((item) => item.id !== selectedUser.id));
        notify(`Đã xóa người dùng "${selectedUser.name}".`, "danger");
      }

      const normalizedKeyword = keyword.trim().toLowerCase();
      const filteredUsers = users.filter((item) =>
        item.name.toLowerCase().includes(normalizedKeyword) ||
        item.username.toLowerCase().includes(normalizedKeyword)
      );

      if (error) {
        return (
          <div className="state-message is-error" role="alert">
            <span className="state-icon"><Icon name="alert" size={26} /></span>
            <strong>Có lỗi xảy ra</strong>
            {error}
            <button className="btn btn-secondary" type="button" onClick={() => setReloadKey((key) => key + 1)}>
              <Icon name="refresh" /> Thử lại
            </button>
          </div>
        );
      }

      return (
        <>
          <div className="table-scroll">
            <table aria-busy={loading}>
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Họ tên</th>
                  <th>Username</th>
                  <th>Email</th>
                  <th>Địa chỉ</th>
                  <th>Số điện thoại</th>
                  <th className="th-actions">Thao tác</th>
                </tr>
              </thead>
              <tbody>
                {loading && Array.from({ length: 6 }, (_, index) => (
                  <tr key={`skeleton-${index}`} aria-hidden="true">
                    <td className="cell-id"><span className="skeleton" style={{ width: 28 }} /></td>
                    <td>
                      <div className="user-cell">
                        <span className="skeleton skeleton-circle" />
                        <span className="skeleton" style={{ flex: 1 }} />
                      </div>
                    </td>
                    <td><span className="skeleton" style={{ width: "70%" }} /></td>
                    <td><span className="skeleton" style={{ width: "85%" }} /></td>
                    <td><span className="skeleton" style={{ width: "90%" }} /></td>
                    <td><span className="skeleton" style={{ width: "75%" }} /></td>
                    <td><span className="skeleton" style={{ width: 140, marginLeft: "auto" }} /></td>
                  </tr>
                ))}

                {!loading && filteredUsers.map((item) => {
                  const address = [item.address?.street, item.address?.suite, item.address?.city].filter(Boolean).join(", ");
                  return (
                    <tr key={item.id} className={item.id === flashId ? "row-flash" : ""}>
                      <td className="cell-id">#{item.id}</td>
                      <td>
                        <div className="user-cell">
                          <Avatar id={item.id} name={item.name} />
                          <strong><Highlight text={item.name} keyword={normalizedKeyword} /></strong>
                        </div>
                      </td>
                      <td className="username-cell" data-label="Username">
                        <Highlight text={item.username} keyword={normalizedKeyword} />
                      </td>
                      <td className="email-cell" data-label="Email">
                        {item.email ? <a href={`mailto:${item.email}`}>{item.email}</a> : <span className="empty-dash">—</span>}
                      </td>
                      <td className="address-cell" data-label="Địa chỉ">
                        {address || <span className="empty-dash">—</span>}
                      </td>
                      <td className="phone-cell" data-label="Số điện thoại">
                        {item.phone || <span className="empty-dash">—</span>}
                      </td>
                      <td>
                        <div className="actions">
                          <button className="btn btn-edit btn-small" type="button" onClick={() => beginEdit(item)} aria-label={`Sửa ${item.name}`}>
                            <Icon name="edit" size={15} /> Sửa
                          </button>
                          <button className="btn btn-delete btn-small" type="button" onClick={() => removeUser(item)} aria-label={`Xóa ${item.name}`}>
                            <Icon name="trash" size={15} /> Xóa
                          </button>
                        </div>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>

          {!loading && !filteredUsers.length && (
            <div className="state-message">
              <span className="state-icon"><Icon name={users.length ? "searchX" : "users"} size={26} /></span>
              <strong>{users.length ? "Không tìm thấy người dùng" : "Danh sách trống"}</strong>
              {users.length ? `Không có kết quả cho "${keyword.trim()}". Hãy thử từ khóa khác.` : "Bấm \"Thêm người dùng\" để tạo người dùng đầu tiên."}
            </div>
          )}

          {!loading && (
            <div className="table-footer">
              <span>Hiển thị <strong>{filteredUsers.length}</strong> / {users.length} người dùng</span>
              {normalizedKeyword && <span>Đang lọc theo từ khóa “{keyword.trim()}”</span>}
            </div>
          )}

          {editing && (
            <UserModal
              title="Chỉnh sửa người dùng"
              description={`Cập nhật thông tin của người dùng #${editing.id}.`}
              icon="edit"
              value={editing}
              submitLabel="Lưu thay đổi"
              onChange={(event) => updateUserField(setEditing, event)}
              onSubmit={saveEdit}
              onClose={() => setEditing(null)}
            />
          )}

          <Toast toast={toast} />
        </>
      );
    }

    function App() {
      const [kw, setKeyword] = React.useState("");
      const [newUser, setNewUser] = React.useState(null);
      const [userCount, setUserCount] = React.useState(0);
      const clearNewUser = React.useCallback(() => setNewUser(null), []);

      return (
        <main className="app-shell">
          <header className="hero">
            <div className="hero-text">
              <p className="eyebrow"><Icon name="users" size={14} /> Bài tập React CRUD</p>
              <h1>Quản lý người dùng</h1>
              <p className="subtitle">Tìm kiếm, thêm mới, cập nhật và xóa người dùng — xây dựng với React Hooks và State Lifting.</p>
            </div>
            <div className="stat-card">
              <span className="stat-icon"><Icon name="users" size={22} /></span>
              <div>
                <span>Tổng người dùng</span>
                <strong>{userCount}</strong>
              </div>
            </div>
          </header>

          <section className="panel" aria-label="Danh sách người dùng">
            <div className="toolbar">
              <SearchForm onChangeValue={setKeyword} />
              <AddUser onAdd={setNewUser} />
            </div>
            <ResultTable
              keyword={kw}
              user={newUser}
              onAdded={clearNewUser}
              onCountChange={setUserCount}
            />
          </section>
        </main>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
